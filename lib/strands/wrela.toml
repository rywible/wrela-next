# The strand lister: strands (one number, to a centre and a radius: grass, hair, reeds, rope)
# drawn near as ribbons facing the eye, each at least a pixel and a half wide, fewer of them as
# they would be thinner, and folded into their host's look far off, each leaving at its own
# distance; straight into the frame's picture with the one shading function.
[package]
name = "strands"

[dependencies]
form = { path = "../form" }
frame = { path = "../frame" }
