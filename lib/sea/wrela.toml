# The open sea's waves: a directional spectrum raised by a wind and a far storm's swell, its waves
# summed on the CPU (the loudest of them, with exact first derivatives and a bound on how they
# bend) and on the GPU into tiles by inverse FFT. Any game sets it up with its own wind and its
# own depths (`waters::Waters`); it knows no shore.
[package]
name = "sea"

[dependencies]
form = { path = "../form" }
