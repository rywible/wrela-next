# The engine: realises matter (docs/design.md, "The engine's four modules"). `matter` (where is
# matter, what is it made of), `ray` (what does this ray meet), `light` (what light arrives
# here), `picture` (this world, this eye, this look -> an image); and the instruments that say
# whether the four are right: `reference` (the world drawn by brute force) and `judge` (a picture
# held to the reference, in numbers). The only package that may touch the GPU.
[package]
name = "engine"
