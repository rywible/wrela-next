# The kit: what any game would agree is true of the world, written as fields.
# `shapes` (ways to write where matter is), `substances` (what matter is made of),
# `looks` (what looks are built from), `motion` (rigs and poses). Nothing here touches the GPU;
# the engine realises what the kit says.
[package]
name = "kit"

[dependencies]
engine = { path = "../engine" }
