# The lister of height charts: a chart over the ground's places (the land, the sea), drawn each
# frame as rings of triangles round the eye, finer near and coarser far, out to its domain's
# edge, straight into the frame's picture; and the sky cooked into a table of directions, which
# a mirror reads.
[package]
name = "heights"

[dependencies]
form = { path = "../form" }
frame = { path = "../frame" }
ocean = { path = "../sea" }
