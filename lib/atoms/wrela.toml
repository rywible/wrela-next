# The solid lister: a solid cooked when the game is built into a closed mesh a set by distance
# (dual contouring), drawn as ordinary triangles in the frame's one pass. (The package keeps the
# name of the atoms it drew before; docs/atoms.md.)
[package]
name = "atoms"

[dependencies]
form = { path = "../form" }
frame = { path = "../frame" }
