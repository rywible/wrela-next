[package]
name = "wrela-wgsl"
description = "The GPU back end: IR to naga IR, validated by WGSL's rules, written as Metal shading language or SPIR-V"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-ir.workspace = true
# Where each binding goes in Metal's argument tables (`wrela_abi::metal`), shared with the host.
wrela-abi.workspace = true
naga = { version = "30", features = ["wgsl-out", "wgsl-in", "msl-out", "spv-out"] }
# SPIR-V's own enums (opcodes, capabilities, decorations) for the compiler's SPIR-V writer
# (`spirv`), which encodes the words itself.
spirv = "0.4"
# A checked shader's mark in the offline tools' cache (`offline`): its bytes' hash.
sha2 = "0.10"
# naga's half floats (`Literal::F16`).
half = { version = "2.5", default-features = false }

[lints]
workspace = true
