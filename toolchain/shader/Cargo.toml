[package]
name = "wrela-shader"
description = "The GPU back end: a GPU module of the IR written as Metal shading language or SPIR-V, by the compiler's own writers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No examples in its docs (they're `text`): rustdoc would cost a run for nothing. The test
# `doc_examples_are_tested` fails if one appears.
doctest = false

[dependencies]
wrela-ir.workspace = true
# Where each binding goes in Metal's argument tables and Vulkan's set (`wrela_abi::metal`,
# `wrela_abi::vulkan`), shared with the host.
wrela-abi.workspace = true
# SPIR-V's own enums (opcodes, capabilities, decorations) for the SPIR-V writer (`spirv`), which
# encodes the words itself.
spirv = "0.4"
# A checked shader's mark in the offline tools' cache (`offline`): its bytes' hash.
sha2 = "0.10"
# A half float's literal: MSL's text (`1.5h`) and SPIR-V's 16 bits, rounded as Rust's own
# conversion rounds an `f32` to the nearest half.
half = { version = "2.5", default-features = false }

[lints]
workspace = true
