[package]
name = "wrela-gpu"
description = "The native host's GPU: Metal on Apple's machines, Vulkan elsewhere, behind one small API shaped for the host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
# Texture formats, blends, depth states and the bindings' slots: the ABI's, shared with the
# compiler.
wrela-abi.workspace = true
# A window's handles, from whatever made the window (the host's winit), for a surface.
raw-window-handle = "0.6"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString", "NSURL", "NSArray", "NSData", "NSDictionary", "NSValue", "NSRange", "NSProcessInfo", "NSObject"] }
objc2-metal = { version = "0.3" }
block2 = "0.6"
# A window's Core Animation layer that Metal draws into: `CAMetalLayer` on its `NSView`.
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-metal", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAMetalLayer", "CAEDRMetadata", "CABase"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSScreen", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ash = "0.38"
# A Vulkan surface from a window's handles (Wayland, X11).
ash-window = "0.13"

[lints.rust]
# The one crate that talks to the GPU's own API.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
large_enum_variant = "allow"

[dev-dependencies]
# Its tests' kernels: built as IR and written by the compiler's own writers.
wrela-shader.workspace = true
wrela-ir.workspace = true
