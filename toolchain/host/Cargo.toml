[package]
name = "wrela-host"
description = "The native host: runs a built wrela program's WASM (wasmtime) and command stream (Metal or Vulkan, `wrela-gpu`), headless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wrela-host"
path = "src/main.rs"
test = false

[features]
default = ["gpu"]
# The GPU: `Host`, which runs the command stream on the machine's own GPU API (`wrela-gpu`:
# Metal, or Vulkan). Without it, the crate is `CpuHost` alone, which the compiler uses to run a
# program's frames for its tests.
gpu = ["dep:wrela-gpu", "dep:wrela-shader", "dep:winit", "dep:gilrs", "dep:cpal"]

[dependencies]
wrela-abi.workspace = true
wasmtime.workspace = true
# The tool host's files: directory-relative handles, so no path or symbolic link leaves a root.
cap-std = "4"
# `O_NONBLOCK`, so opening a tool's file never waits on a FIFO; process groups for `run`.
libc = "0.2"
# `std::tool::run`'s process groups, killed without `unsafe`, and files opened through a directory
# handle without following a link (`confined`); already in the tree, for cap-std.
rustix = { version = "1", features = ["process", "fs"] }
# `std::tool::http`'s client: blocking, on the tool host's worker threads, over rustls.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# `std::tool::image`: PNG (already the GPU host's, for frames), JPEG, and WebP through libwebp,
# which decodes it and encodes it lossily, as Pillow does (docs/citations.md).
png = "0.18"
# Without its SIMD paths, so a JPEG decodes to the same pixels on every machine.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
webp = { version = "0.3", default-features = false }
# Compiled code's names in the code cache (`code`), and the drive service's builds by their
# WASM: SHA-256, already the CLI's.
sha2 = "0.10"
# The tool host's servers' gzip at serve time (`loopback::get_file`).
flate2 = "1"
wrela-gpu = { workspace = true, optional = true }
# `wrela-host --window`: a window the frames are shown in, and its events.
winit = { version = "0.30", optional = true }
# `wrela-host --window`: gamepads, in the W3C standard mapping (`live`).
gilrs = { version = "0.11", optional = true }
# `wrela-host --window`: the program's voice on the audio device (`voice`). On Linux it links
# ALSA's libasound, so a Linux build needs libasound2-dev (pkg-config's `alsa`).
cpal = { version = "0.18", optional = true }
# The host's own kernel (`step`, the indirect dispatches' check), built as IR and written by the
# compiler's own writers.
wrela-shader = { workspace = true, optional = true }

[dev-dependencies]
wat = "1.260"
# The tests' shaders, built as IR (`common::shaders`) and written for the target by the compiler's
# own writers (`common::write_shader`).
wrela-ir.workspace = true
wrela-shader.workspace = true

[lints]
workspace = true
