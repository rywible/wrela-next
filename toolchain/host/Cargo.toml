[package]
name = "wrela-host"
description = "The native host: runs a built wrela program's WASM (wasmtime) and command stream (wgpu), headless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wrela-host"
path = "src/main.rs"
test = false

[features]
default = ["gpu"]
# The GPU: `Host`, which runs the command stream under wgpu. Without it, the crate is
# `CpuHost` alone, which the compiler uses to run a program's frames for its tests.
gpu = [
    "dep:wgpu",
    "dep:pollster",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
]

[dependencies]
wrela-abi.workspace = true
wasmtime.workspace = true
# The tool host's files: directory-relative handles, so no path or symbolic link leaves a root.
cap-std = "4"
# `O_NONBLOCK`, so opening a tool's file never waits on a FIFO; process groups for `run`.
libc = "0.2"
# `std::tool::run`'s process groups, killed without `unsafe`, and files opened through a directory
# handle without following a link (`confined`); already in the tree, for cap-std.
rustix = { version = "1", features = ["process", "fs"] }
# `std::tool::http`'s client: blocking, on the tool host's worker threads, over rustls.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# `std::tool::image`: PNG (already the GPU host's, for frames), JPEG, and WebP through libwebp,
# which decodes it and encodes it lossily, as Pillow does (docs/citations.md).
png = "0.18"
# Without its SIMD paths, so a JPEG decodes to the same pixels on every machine.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
webp = { version = "0.3", default-features = false }
# Compiled code's names in the code cache (`code`), and the drive service's builds by their
# WASM: SHA-256, already the CLI's.
sha2 = "0.10"
# The tool host's servers' gzip at serve time (`loopback::get_file`).
flate2 = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }

# `wrela-host --pipelines` on Metal (`pipeline_report`): each compute pipeline's MSL compiled
# again as wgpu-hal's Metal backend compiles a passthrough shader, so Metal reports its SIMD
# width, its limit of threads and its threadgroup memory; and `--capture` (`capture`), a frame's
# GPU trace by Metal's capture manager. The versions wgpu 30 uses.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString", "NSURL"], optional = true }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLAllocation", "MTLCaptureManager", "MTLComputePipeline", "MTLDevice", "MTLLibrary", "MTLPipeline"], optional = true }

[dev-dependencies]
wat = "1.260"
# The tests' hand-written WGSL shaders, written as the MSL the host takes by the compiler's own
# MSL writer (`common::write_shader`).
wrela-wgsl.workspace = true

[lints]
workspace = true
