# Hakuro, the hero: the fox-masked wanderer locked on Nov 5 (hero-masks v17). His limbs, trunk
# and coat are charted forms (`chart`) over the human figure's (`figure`) on his skeleton; his
# mask, hair, boots and belt are solids (`form`); his coat's tails a sheet stepped as cloth; his
# palette is the moves' rig's (`motion`) mapped onto his bones. The Quaternius body he was
# designed on is only a measured reference: nothing here is loaded from a file. How he is handed to
# the listers (his pieces to the chart lister, his tails to the sheet lister, his hair's locks to
# the strand lister) is `drawn`, which every scene he's in uses.
[package]
name = "hakuro"

[dependencies]
chart = { path = "../../lib/chart" }
figure = { path = "../figure" }
form = { path = "../../lib/form" }
motion = { path = "../../lib/motion" }
limbs = { path = "../../lib/limbs" }
strands = { path = "../../lib/strands" }
frame = { path = "../../lib/frame" }
