# The opening, stage 1 (docs/opening.md): the old game's opening scene without its skiff and its
# floating isle. A gale's sea to the horizon, the storm's deck over the whole sky, the air, the
# sea stacks and the far islands, seen from where the skiff will be, on its path through the
# first minute (rywible/wrela 7ae6711e, scenes/opening).
#
#     tools/wrela build game/opening -o <out> [--set FROM=10.0] [--set LOAD=400]
#     tools/wrela test game/opening
[package]
name = "opening"

[dependencies]
atoms = { path = "../../lib/atoms" }
chart = { path = "../../lib/chart" }
limbs = { path = "../../lib/limbs" }
form = { path = "../../lib/form" }
gale = { path = "../gale" }
frame = { path = "../../lib/frame" }
heights = { path = "../../lib/heights" }
hakuro = { path = "../hakuro" }
moves = { path = "../moves" }
motion = { path = "../../lib/motion" }
ocean = { path = "../../lib/sea" }
