# The volume spike (not the engine): one volume of matter round the eye, every ray a cone through
# it, held to today's mesh path and to the traced reference. Plan and log are outside the
# repository (wrela-notes/volume/NOTES.md). Built with the main checkout's tools:
#
#     tools/wrela build <worktree>/spikes/volume -o <out> [--set MODE=1] [--set JUDGE=true]
[package]
name = "volume"

[dependencies]
atoms = { path = "../../lib/atoms" }
form = { path = "../../lib/form" }
frame = { path = "../../lib/frame" }
opening = { path = "../../game/opening" }
hakuro = { path = "../../game/hakuro" }
motion = { path = "../../lib/motion" }
moves = { path = "../../game/moves" }
